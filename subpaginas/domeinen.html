<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>De geschiedenisdomeinen</title>
    <link rel="shortcut icon" href="../fotos/faviconWhite.ico" type="image/x-icon">
    <link href="/style/Main.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="stylesheet" href="/style/OudeNabijeOosten.css">
    <link rel="stylesheet" href="../style/domeinenGame.css">
    <link rel="stylesheet" href="../style/domeinen.css">
</head>
<body>
<header class="container-fluid" id="header">
    <div class="row">
        <img class="col-2" height="200rem" src="/fotos/logoWhite.svg" alt="">
        <h1 class="col-9 my-auto">De geschiedenisdomeinen</h1>
        <p class="col-1 my-auto fs-3 h-100"><a href="../index.html">Terug</a></p>
    </div>
</header>

<section class="container pt-5">
    <div class="row">
       <div class="col-12 d-flex justify-content-center">
           <div class="containerGrid">
               <div class="top highlight" id="item1">Economisch</div>
               <div class="left" id="item2">Sociaal</div>
               <div id="itemLeeg"></div>
               <div class="right" id="item3">Cultureel</div>
               <div class="bottom" id="item4">Politiek</div>
           </div>
       </div>
        <div class="row mt-4">
            <div class="col-12 text-center">
                <button id="start" class="btn btn-primary">Draai</button>
            </div>
        </div>
    </div>
</section>



<section>
    <div id="game-container">
        <canvas id="gameCanvas"></canvas>

        <div id="ui-layer">
            <div id="question-text">Klik op start om te beginnen</div>
            <div id="score-text">Score: 0</div>
        </div>

        <button id="start-knop">START SPEL</button>
    </div>
</section>

<footer class="ps-3 mt-5 py-5" id="footer">
    <h5 class="fw-bold">DIGITIME</h5>
    <p>Leren over de geschiedenis, stap voor stap.</p>
    <p class="mb-0">&copy; 2026 DIGITIME - Alle rechten voorbehouden.</p>
</footer>
<script src="../js/Domein.js"></script>
<script src="../js/rotatie.js"></script>
</body>
</html>
